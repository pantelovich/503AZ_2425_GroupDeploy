name: Deploy CivicNexus CloudFormation Stack

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      template_file:
        description: CloudFormation template to deploy
        required: true
        default: cfstack-secure.yml
        type: choice
        options:
          - cfstack-secure.yml
          - cfstack-402-serverless.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Validate YAML templates
        run: |
          ruby -e 'require "yaml"; YAML.load_file("cfstack-secure.yml"); YAML.load_file("cfstack-402-serverless.yml")'

      - name: Check shell script syntax
        run: |
          bash -n scripts/collect_database_evidence.sh
          bash -n scripts/collect_network_audit_evidence.sh
          bash -n scripts/collect_webserver_evidence.sh
          bash -n scripts/list_lab_resources.sh
          bash -n scripts/update_lab_credentials.sh

      - name: Run ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Validate CloudFormation template
        run: |
          if [ "$(wc -c < "${{ inputs.template_file }}")" -le 51200 ]; then
            aws cloudformation validate-template --template-body file://${{ inputs.template_file }}
          else
            echo "Skipping direct validate-template because ${{ inputs.template_file }} is over the 51200 byte API body limit."
          fi

      - name: Deploy Secure CivicNexus Stack
        if: inputs.template_file == 'cfstack-secure.yml'
        run: |
          aws cloudformation deploy \
            --stack-name ${{ secrets.GROUP_NAME }}-civicnexus-stack \
            --template-file ${{ inputs.template_file }} \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              GroupName=${{ secrets.GROUP_NAME }} \
              GroupSize=${{ secrets.GROUP_SIZE }} \
              KeyName=${{ secrets.KEY_NAME }} \
              EnableVDI=true \
              EnableEvidenceServices=false \
              EnableOpenVPN=false \
              MongoAppUsername=civicApp \
              MongoAppPassword=${{ secrets.MONGO_APP_PASSWORD }}

      - name: Deploy 402 Serverless Add-on
        if: inputs.template_file == 'cfstack-402-serverless.yml'
        run: |
          aws cloudformation deploy \
            --stack-name ${{ secrets.GROUP_NAME }}-402-serverless-addon \
            --template-file ${{ inputs.template_file }} \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              ProjectName=civicnexus402 \
              GroupName=${{ secrets.GROUP_NAME }} \
              AllowedOrigin="*"

      - name: Show stack outputs
        run: |
          if [ "${{ inputs.template_file }}" = "cfstack-402-serverless.yml" ]; then
            STACK_NAME="${{ secrets.GROUP_NAME }}-402-serverless-addon"
          else
            STACK_NAME="${{ secrets.GROUP_NAME }}-civicnexus-stack"
          fi

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs" \
            --output table
